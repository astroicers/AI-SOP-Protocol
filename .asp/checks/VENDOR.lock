# .asp/checks/VENDOR.lock — vendored 檢查本體來源記錄(asp-ng issue #43)
# 格式:<檔名> <上游 repo> <上游路徑> <sha256> [<ref>]
# 更新方式:自上游重新 vendoring 後,以 sha256sum 更新對應列並改 ref;勿就地改檔。
#
# 第五欄 <ref>(2026-09-08 補):vendoring 當下的上游版本座標(tag/commit)。四欄格式
# 沒有任何版本資訊,消費端無從得知自己停在哪一版——那正是「本地竄改偵測全綠、上游
# 早已修補」的結構成因(#43 AC-3)。vendor-verify.sh 自 ASP_VENDOR_REF_DEADLINE
# (預設 2026-09-30)起對缺 ref 的列判紅。
#
# 上游 repo 更正(2026-09-08):原記 `astroicers/asp-ng`,實查為 `Aries-Crew/asp-ng`
# 的 **fork**,且已落後上游(fork 末次推送 08-26 vs 上游 09-08)。來源標記指向過期
# 副本時,上游對帳會拿舊內容比而給出假綠燈,故更正為真上游。
#
# 註:test-fresh.sh 為本 repo 自有(P0-5 自 ship-gate hook 抽出),非 vendored,不列入。
#
# 非腳本的 vendored 物(2026-09-08):gitleaks.toml 是**規則庫**不是檢查本體,但同樣
# 適用「被就地改了沒人發現」這個風險——把一條 rule 刪掉,gitleaks 照樣 exit 0,
# 密鑰掃描就無聲失效。檔名以相對路徑寫(lock 位於 .asp/checks/,規則庫在 .asp/),
# 這是刻意:規則庫路徑須與上游一致(asp-gate.yaml 的 --config 引用 .asp/gitleaks.toml)。
