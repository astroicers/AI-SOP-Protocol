# asp-gate.yaml — 檢查單一事實源(asp-ng ADR-000 §7;P0-5 薄包裝落地)
# 本檔為 ASP v4 repo 的 gate 定義;渲染:asp-ng 的 `asp render gate -s asp-gate.yaml -o .asp/gate.sh`
# v0.1 僅收錄 ship-gate hook 的檢查本體——行為不變優先(asp-ng issue #5 AC),擴充走本檔+重渲染。
version: 0.1
checks:
  - id: test-fresh
    layer: gate
    tool: builtin-script
    args:
      inputs: "env:ASP_GATE_PROJ(受檢 repo 頂層)、env:ASP_GATE_COMMAND(--amend 判定)"
    severity: blocker
    origin: "pretooluse-ship-gate.sh 檢查本體(SPEC-013/ADR-020)"
    notes: "腳本 .asp/checks/test-fresh.sh;由 hook 以 ASP_GATE_HOME 錨定呼叫"

  - id: gitleaks
    layer: gate
    tool: gitleaks
    args: [protect, --staged, --config, .asp/gitleaks.toml]
    severity: blocker
    origin: "asp-ship step 9 / CLAUDE-IR-2(敏感資訊保護);規則庫 .asp/gitleaks.toml 自 asp-ng v0.41.0 vendoring,受 VENDOR.lock 竄改偵測"
    notes: >-
      **2026-09-08 補進來的理由**:此前這條鐵則的機械支撐掛在 `/asp-ship` Step 9,
      而 2026-08-19 校準把 /asp-ship 降為「大型碼改動的選用自檢」——於是
      「純文件 / config 直接乾淨 commit」這條路徑上,密鑰掃描整條消失,鐵則只剩散文。
      移進 gate 後它與 commit 同生命週期,不再依賴人記得跑哪支 skill。
      工具缺席時 `run_check` 走 `command -v` skip(消費端零波及);gitleaks 8.30.1 實測
      `protect --staged` 仍可用(該子命令已自 Available Commands 隱藏但保留),
      並實證能攔下 staged 的假密鑰(rc=1),見 .asp-fact-check.md FC-016。

  - id: vendor-verify
    layer: gate
    tool: builtin-script
    args:
      inputs: "env:ASP_GATE_PROJ 的 .asp/checks/VENDOR.lock;無 lock→skip 200"
    severity: blocker
    origin: "asp-ng issue #43:vendored 檢查本體與上游對帳(本 repo 為消費端)"
    notes: >-
      本地竄改偵測(比「本機檔案 vs 本機 VENDOR.lock」)。**上游同步偵測仍是缺口**:
      原定「asp-ng 轉 public 後以 raw 比對」之路已失效——2026-08-25 人裁維持
      free/private。上游現有 `vendor-upstream.sh` 補這一格(比「lock 記錄 vs 上游現況」,
      可用本機 checkout 當 adapter、零憑證零網路),本 repo 尚未 vendoring。
      2026-09-08 實例:git-guard.sh/vendor-verify.sh 落後上游兩版而本檢查全綠,
      是靠人工比對才發現——這正是本格缺席的代價。
